[project]
name = "deepwiki-mcp"
version = "0.1.0"
description = "MCP server for DeepWiki project management. The host LLM drives wiki authoring via save_wiki_plan / save_wiki_page."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0",
]

[project.scripts]
deepwiki-mcp = "deepwiki_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepwiki_mcp"]
